<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITLE: what this explains</title>
<!--
  Studio starter: React 19 + Radix Primitives (esm.sh) + Tailwind (CDN) with
  shadcn-style tokens. Copy this file, keep the components, replace CONTENT.
  Rules: visual or interactive only, no paragraph over 60 words, a <Quiz>
  after every 2-3 sections in explainers.
-->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {darkMode: "media", theme: {extend: {
    colors: {bg: "var(--bg)", fg: "var(--fg)", muted: "var(--muted)", card: "var(--card)", line: "var(--line)", accent: "var(--accent)", ok: "var(--ok)", bad: "var(--bad)"},
    fontFamily: {serif: ['"Anthropic Serif Text"', "Georgia", "serif"], display: ['"Anthropic Serif Display"', '"Anthropic Serif Text"', "Georgia", "serif"]},
  }}};
</script>
<style>
  :root { --bg:#faf9f5; --fg:#141413; --muted:#73726c; --card:#fff; --line:#e5e2d8; --accent:#d97757; --ok:#5a8a5e; --bad:#b53333; }
  @media (prefers-color-scheme: dark) { :root { --bg:#262624; --fg:#f5f4ee; --muted:#a6a39a; --card:#30302e; --line:#3e3e3a; --accent:#d97757; --ok:#7fae83; --bad:#e5655b; } }
  body { background: var(--bg); color: var(--fg); }
</style>
</head>
<body class="font-serif antialiased">
<div id="root"></div>
<script type="module">
import React, {useState} from "https://esm.sh/react@19";
import {createRoot} from "https://esm.sh/react-dom@19/client";
import * as Tabs from "https://esm.sh/@radix-ui/react-tabs@1?deps=react@19,react-dom@19";
import * as Accordion from "https://esm.sh/@radix-ui/react-accordion@1?deps=react@19,react-dom@19";
import htm from "https://esm.sh/htm@3";
const html = htm.bind(React.createElement);

// ---------- components (keep) ----------
const Section = ({id, kicker, title, children}) => html`
  <section id=${id} class="max-w-4xl mx-auto px-6 py-14">
    <p class="text-xs tracking-widest uppercase text-accent font-sans mb-2">${kicker}</p>
    <h2 class="font-display text-4xl font-light mb-6">${title}</h2>
    ${children}
  </section>`;

const Card = ({title, children}) => html`
  <div class="bg-card border border-line rounded-xl p-5">
    <h3 class="font-display text-lg mb-2">${title}</h3>
    <div class="text-[15px] text-muted leading-relaxed">${children}</div>
  </div>`;

const Stat = ({value, label}) => html`
  <div class="bg-card border border-line rounded-xl p-5">
    <div class="font-display text-4xl">${value}</div>
    <div class="text-sm text-muted font-sans mt-1">${label}</div>
  </div>`;

const TabsBox = ({tabs}) => html`
  <${Tabs.Root} defaultValue=${tabs[0].id} class="bg-card border border-line rounded-xl">
    <${Tabs.List} class="flex gap-1 p-1 border-b border-line">
      ${tabs.map((t) => html`<${Tabs.Trigger} key=${t.id} value=${t.id}
        class="px-3 py-1.5 rounded-lg text-sm font-sans data-[state=active]:bg-fg data-[state=active]:text-bg">${t.label}</${Tabs.Trigger}>`)}
    </${Tabs.List}>
    ${tabs.map((t) => html`<${Tabs.Content} key=${t.id} value=${t.id} class="p-5">${t.body}</${Tabs.Content}>`)}
  </${Tabs.Root}>`;

const Steps = ({items}) => html`
  <${Accordion.Root} type="single" collapsible class="divide-y divide-line bg-card border border-line rounded-xl">
    ${items.map((it, i) => html`<${Accordion.Item} key=${i} value=${String(i)}>
      <${Accordion.Trigger} class="w-full text-left px-5 py-3 font-display">${i + 1}. ${it.title}</${Accordion.Trigger}>
      <${Accordion.Content} class="px-5 pb-4 text-muted text-[15px]">${it.body}</${Accordion.Content}>
    </${Accordion.Item}>`)}
  </${Accordion.Root}>`;

/** Tiny retention quiz: one question, instant feedback, a one-line why. */
const Quiz = ({q, options, answer, why}) => {
  const [picked, setPicked] = useState(null);
  return html`
    <div data-quiz class="max-w-4xl mx-auto px-6">
      <div class="border-2 border-dashed border-accent/50 rounded-xl p-5 bg-card">
        <p class="text-xs uppercase tracking-widest text-accent font-sans mb-2">Quick check</p>
        <p class="font-display text-lg mb-3">${q}</p>
        <div class="flex flex-wrap gap-2">
          ${options.map((o, i) => html`<button key=${i} onClick=${() => setPicked(i)}
            class=${"px-3 py-1.5 rounded-lg border text-sm font-sans " + (picked === null ? "border-line hover:border-accent" : i === answer ? "border-ok text-ok" : i === picked ? "border-bad text-bad" : "border-line opacity-50")}>${o}</button>`)}
        </div>
        ${picked !== null && html`<p class="mt-3 text-sm ${picked === answer ? "text-ok" : "text-bad"}">${picked === answer ? "Right. " : "Not quite. "}${why}</p>`}
      </div>
    </div>`;
};

// ---------- CONTENT (replace) ----------
const App = () => html`
  <header class="max-w-4xl mx-auto px-6 pt-20 pb-6">
    <p class="text-xs tracking-widest uppercase text-accent font-sans mb-3">KICKER</p>
    <h1 class="font-display text-6xl font-light leading-tight">One-line takeaway.</h1>
  </header>

  <${Section} id="what" kicker="1 · What" title="The idea in one picture">
    <div class="grid sm:grid-cols-3 gap-4">
      <${Stat} value="3" label="moving parts" />
      <${Stat} value="1" label="source of truth" />
      <${Stat} value="0" label="servers to run" />
    </div>
  </${Section}>

  <${Section} id="how" kicker="2 · How" title="Pick a view">
    <${TabsBox} tabs=${[
      {id: "a", label: "Flow", body: html`<pre class="mermaid">flowchart LR; A[Input] --> B[Process] --> C[Output]</pre>`},
      {id: "b", label: "Steps", body: html`<${Steps} items=${[{title: "First", body: "Short."}, {title: "Then", body: "Short."}]} />`},
    ]} />
  </${Section}>

  <${Quiz} q="Which part holds the source of truth?" options=${["Input", "Process", "Output"]} answer=${1} why="Process owns state; the others are views of it." />

  <${Section} id="why" kicker="3 · Why" title="Trade-offs">
    <div class="grid sm:grid-cols-2 gap-4">
      <${Card} title="Good at">Fast, simple, cheap.</${Card}>
      <${Card} title="Bad at">Huge data, many writers.</${Card}>
    </div>
  </${Section}>
`;

createRoot(document.getElementById("root")).render(html`<${App} />`);
const mermaid = (await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs")).default;
mermaid.initialize({startOnLoad: false, theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "neutral"});
setTimeout(() => mermaid.run(), 50);
</script>
</body>
</html>
